# Tiny Tapeout project information
project:
  title:        "FoRG Protocol Emulator"      # Project title
  author:       "FoRG"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A programmable general-purpose protocol emulator ASIC"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Target clock, subject to physical timing verification

  # Tile allocation for the Jane Street CMOS5L competition.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_forg_protocol_engine"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "protocol_engine.v"
    - "protocol_top.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "address_0 / packet_data_0 / register_0"
  ui[1]: "address_1 / packet_data_1 / register_1"
  ui[2]: "address_2 / packet_data_2"
  ui[3]: "address_3 / packet_data_3"
  ui[4]: "address_4 / packet_strobe"
  ui[5]: "load_high_byte / packet_mode / readback_0"
  ui[6]: "load_write / readback_1"
  ui[7]: "run"

  # Outputs
  uo[0]: "readback_0"
  uo[1]: "readback_1"
  uo[2]: "readback_2"
  uo[3]: "readback_3"
  uo[4]: "readback_4"
  uo[5]: "readback_5"
  uo[6]: "readback_6"
  uo[7]: "readback_7"

  # Bidirectional pins
  uio[0]: "gpio_0"
  uio[1]: "gpio_1"
  uio[2]: "gpio_2"
  uio[3]: "gpio_3"
  uio[4]: "gpio_4"
  uio[5]: "gpio_5"
  uio[6]: "gpio_6"
  uio[7]: "gpio_7"

# Do not change!
yaml_version: 6
