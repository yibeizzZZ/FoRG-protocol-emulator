name: uart-baseline
on:
  push:
    paths:
      - 'src/uart*.v'
      - 'test/**'
      - 'scripts/**'
      - 'src/config.json'
      - '.github/workflows/uart-baseline.yaml'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Select independent UART baseline
        run: python3 scripts/select-uart-build.py
      - uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l
  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l
  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Select UART tests
        run: python3 scripts/select-uart-build.py
      - uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l
