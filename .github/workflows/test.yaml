name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Test Python tooling
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # Preserve the report before validation can fail the step.
          cp results.xml results-core.xml
          python ../scripts/check-test-results.py results.xml

      - name: Check firmware UART against the fixed reference
        run: |
          cd test
          make -B TARGET=uart_firmware
          cp results.xml results-uart-firmware.xml
          python ../scripts/check-test-results.py results.xml

      - name: Check UART timing at multiple divisors
        run: |
          cd test
          for divisor in 1 2 4 17 434; do
            make -B TARGET=uart UART_CLKS_PER_BIT=$divisor
            cp results.xml results-uart-$divisor.xml
            python ../scripts/check-test-results.py results.xml
          done

      - name: Check full-duplex SPI firmware
        run: |
          cd test
          make -B TARGET=spi_firmware
          cp results.xml results-spi-firmware.xml
          cp tb.fst spi_firmware.fst
          python ../scripts/check-test-results.py results.xml

      - name: Check I2C probe on resolved open-drain buses
        run: |
          cd test
          for delays in "0 0 0" "0 300 0" "1000 0 300"; do
            read -r rise scl_fall sda_fall <<< "$delays"
            tag="$rise-$scl_fall-$sda_fall"
            make -B TARGET=i2c_firmware I2C_RISE_NS=$rise I2C_SCL_FALL_NS=$scl_fall I2C_SDA_FALL_NS=$sda_fall
            cp results.xml "results-i2c-firmware-$tag.xml"
            cp i2c_firmware.fst "i2c_firmware-$tag.fst"
            python ../scripts/check-test-results.py results.xml
          done

      - name: Check complete RAM-configured I2C transactions
        run: |
          cd test
          for delays in "0 0 0" "0 300 0" "1000 0 300"; do
            read -r rise scl_fall sda_fall <<< "$delays"
            tag="$rise-$scl_fall-$sda_fall"
            make -B TARGET=i2c_master I2C_RISE_NS=$rise I2C_SCL_FALL_NS=$scl_fall I2C_SDA_FALL_NS=$sda_fall
            cp results.xml "results-i2c-master-$tag.xml"
            cp i2c_firmware.fst "i2c_master-$tag.fst"
            python ../scripts/check-test-results.py results.xml
          done

      - name: Preserve the original engine regression
        run: |
          cd test
          make -B TARGET=legacy
          cp results.xml results-legacy.xml
          python ../scripts/check-test-results.py results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results-*.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/uart_firmware.fst
            test/spi_firmware.fst
            test/i2c_firmware*.fst
            test/i2c_master*.fst
            test/results.xml
            test/results-*.xml
            test/output/*
